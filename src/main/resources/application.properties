spring.application.name=famicup-api
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
debug=false
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/famicup_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:famicup_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:famicup_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.cache.type=caffeine
spring.cache.cache-names=systemParameters,teams,upcomingMatches,ranking
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

famicup.cors.allowed-origins=${FAMICUP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

jwt.secret=${JWT_SECRET:famicup-development-secret-key-change-me-please-64chars-minimum}
jwt.issuer=${JWT_ISSUER:famicup-api}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
jwt.refresh-inactivity-expiration-seconds=${JWT_REFRESH_INACTIVITY_SECONDS:1800}

api.football.base-url=${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
api.football.api-key=${API_FOOTBALL_KEY:}
api.football.timeout-seconds=${API_FOOTBALL_TIMEOUT_SECONDS:10}
api.football.world-cup.league-id=${API_FOOTBALL_WORLD_CUP_LEAGUE_ID:1}
api.football.world-cup.season=${API_FOOTBALL_WORLD_CUP_SEASON:2026}
api.football.colombia.team-id=${API_FOOTBALL_COLOMBIA_TEAM_ID:}

famicup.scheduler.enabled=${FAMICUP_SCHEDULER_ENABLED:false}
famicup.scheduler.fixtures-cron=${FAMICUP_FIXTURES_CRON:0 0 */6 * * *}
famicup.scheduler.results-cron=${FAMICUP_RESULTS_CRON:0 */15 * * * *}
famicup.scheduler.recent-results-hours=${FAMICUP_RECENT_RESULTS_HOURS:6}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
