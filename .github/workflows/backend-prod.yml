name: Backend PROD - Build and Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-prod
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: app-famicup-api-prod
  AZURE_RESOURCE_GROUP: rg-famicup-prod
  JAVA_VERSION: "21"

jobs:
  build-and-deploy:
    name: Build and deploy backend PROD
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw

      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests

      - name: Locate generated JAR
        id: jar
        shell: bash
        run: |
          JAR_PATH="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)"

          if [ -z "$JAR_PATH" ]; then
            echo "No JAR file found in target/"
            exit 1
          fi

          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$JAR_PATH"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy JAR to Azure App Service PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ steps.jar.outputs.JAR_PATH }}

      - name: Validate health endpoint
        shell: bash
        run: |
          APP_HOST="$(az webapp show \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query defaultHostName \
            -o tsv)"

          echo "Validating https://${APP_HOST}/actuator/health"

          for i in {1..30}; do
            if curl -fsS "https://${APP_HOST}/actuator/health"; then
              echo "Backend PROD health check passed"
              exit 0
            fi

            echo "Waiting for backend PROD startup... attempt $i"
            sleep 15
          done

          echo "Backend PROD health check failed"
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
